<title>Cruze Original Denim</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    text-align:center;
    padding:30px 15px;
}

.card{
    max-width:500px;
    width:100%;
    margin:auto;
    background:#1c1c1c;
    padding:25px;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

h1{
    margin-bottom:5px;
}

p{
    color:#ccc;
    line-height:1.6;
    margin-top:10px;
}

.btn{
    display:block;
    width:100%;
    margin:12px 0;
    padding:14px;
    text-decoration:none;
    background:#fff;
    color:#111;
    border-radius:10px;
    font-weight:bold;
    transition:all 0.3s ease;
}

/* Hover Effect */
.btn:hover{
    background:#f5f5f5;
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 8px 20px rgba(255,255,255,0.15);
}

/* Click Effect */
.btn:active{
    transform:scale(0.98);
}

/* Mobile Responsive */
@media (max-width:600px){
    body{
        padding:15px;
    }

    .card{
        padding:20px;
    }

    h1{
        font-size:1.5rem;
    }

    .btn{
        font-size:1rem;
        padding:16px;
    }
}
</style>
